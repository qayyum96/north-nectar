# Supabase's free plan pauses a project after 7 days without activity. This makes one small
# read twice a week so the shop's database stays awake. Needs two repository secrets:
#   SUPABASE_URL       the project URL (https://<ref>.supabase.co)
#   SUPABASE_ANON_KEY  the publishable key (sb_publishable_...)
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 3 * * 1,4" # Monday and Thursday, 08:17 Pakistan time
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one category
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 10 \
            "${SUPABASE_URL%/}/rest/v1/categories?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "Supabase answered $status"
          test "$status" = "200"
