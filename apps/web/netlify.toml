# Netlify site for the shop (northnectar.com).
# Netlify UI: Base directory = empty (repository root), Package directory = apps/web.
# Next.js is detected automatically (Netlify's OpenNext adapter). Paths are from the repo root.

[build]
  command = "pnpm --filter @northnectar/web build"
  publish = "apps/web/.next"
  # Each production deploy uses free-plan credits, so skip the build when nothing the shop uses
  # changed (exit 0 = skip, 1 = build). Manual redeploys of the same commit always build.
  ignore = "if [ -z \"$CACHED_COMMIT_REF\" ] || [ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ]; then exit 1; fi; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/web packages package.json pnpm-lock.yaml pnpm-workspace.yaml"

[build.environment]
  NODE_VERSION = "22"
  # Netlify's Next.js runtime needs Next and its dependencies hoisted with pnpm.
  PNPM_FLAGS = "--shamefully-hoist"
  # Public on purpose (NEXT_PUBLIC_ values are sent to the browser; the Supabase publishable key
  # is protected by row level security). Secrets such as the service key are still scanned.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_SITE_ENV,NEXT_PUBLIC_MEDIA_URL,CATALOG_SOURCE,CATALOG_INCLUDE_DRAFTS"
