# Netlify site for the admin portal (app.northnectar.com).
# Netlify UI: Base directory = empty (repository root), Package directory = apps/admin.
# Next.js is detected automatically (Netlify's OpenNext adapter). Paths are from the repo root.

[build]
  command = "pnpm --filter @northnectar/admin build"
  publish = "apps/admin/.next"
  # Each production deploy uses free-plan credits, so skip the build when nothing the admin uses
  # changed (exit 0 = skip, 1 = build). Manual redeploys of the same commit always build.
  ignore = "if [ -z \"$CACHED_COMMIT_REF\" ] || [ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ]; then exit 1; fi; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/admin packages package.json pnpm-lock.yaml pnpm-workspace.yaml"

[build.environment]
  NODE_VERSION = "22"
  # Netlify's Next.js runtime needs Next and its dependencies hoisted with pnpm.
  PNPM_FLAGS = "--shamefully-hoist"
